<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Website Kartini</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      transition: 0.3s;
    }

    header {
      text-align: center;
      padding: 20px;
      color: white;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    img {
      width: 200px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 80%;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff758c;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #ff4b6e;
    }

    .hidden {
      display: none;
    }

    .dark {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>Website Kartini</h1>
  <p>Habis Gelap Terbitlah Terang</p>
</header>

<div class="container">

  <!-- Foto Kartini -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Kartini.jpg" alt="Kartini">

  <!-- Login -->
  <div class="card" id="loginBox">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Masuk</button>
    <p id="error" style="color:red;"></p>
  </div>

  <!-- Konten setelah login -->
  <div class="card hidden" id="content">
    <h2>Selamat Datang!</h2>
    <p>Kamu berhasil login 🎉</p>

    <!-- Interaktif -->
    <button onclick="ubahTema()">Ganti Tema 🌙</button>
    <button onclick="showAlert()">Klik Aku</button>
  </div>

</div>

<script>
  function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "123") {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("content").classList.remove("hidden");
    } else {
      document.getElementById("error").innerText = "Username atau password salah!";
    }
  }

  function ubahTema() {
    document.body.classList.toggle("dark");
  }

  function showAlert() {
    alert("Semangat belajar seperti Kartini! 💪");
  }
</script>

</body>
</html>
